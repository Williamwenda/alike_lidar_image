[project]
name = "alike-lidar-image"
version = "0.1.0"
description = "Fine-tuning ALIKE keypoints/descriptors on low-resolution lidar intensity images"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "tqdm",
    "pillow",
    "pytorch-lightning>=2.6",
    "tensorboard",
    "numba",
    "h5py",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "cython",
    "setuptools",
    "thop",
]

[tool.uv]
package = false
